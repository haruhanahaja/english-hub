  <script>
    /* 첫 페인트 전에 테마 적용 */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('autoword.v1') || '{}');
        var t = localStorage.getItem('englishhub.theme') || s.theme || 'auto';
        if (t === 'auto') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    })();
  </script>

    <aside class="side" id="side"></aside>
    <header class="mtop" id="mtop"></header>

    <nav class="tabbar" id="tabbar" aria-label="주 메뉴"></nav>
  </div>

  <div class="session" id="session" hidden></div>
  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
